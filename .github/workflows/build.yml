name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.10.0'
          cache: 'npm'

      - run: npm ci

      # Fails on any syntax error in scripts/, which is the point.
      - run: npm run build

      - name: Check manifest is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('module.json','utf8'))"
